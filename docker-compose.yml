version: '3.8'

services:
  bot:
    build: .
    container_name: telegram_reaction_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    container_name: reaction_bot_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
